version: 2

models:
  - name: dim_location
    columns:
      - name: location_id
        tests:
          - unique
          - not_null

  - name: dim_date
    columns:
      - name: date_day
        tests:
          - unique
          - not_null

  - name: fact_trips
    columns:
      - name: trip_id
        tests:
          - unique
          - not_null
      - name: pickup_location_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_id
      - name: dropoff_location_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_location')
                field: location_id
      - name: payment_type_id
        tests:
          - relationships:
              arguments:
                to: ref('dim_payment_type')
                field: payment_type_id
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "fare_amount >= 0"
